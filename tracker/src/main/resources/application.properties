spring.application.name=tracker

# MySQL (create the database first: CREATE DATABASE placement_tracker;)
spring.datasource.url=jdbc:mysql://localhost:3306/placement_tracker
spring.datasource.username=root
spring.datasource.password=your_mysql_password

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# File uploads (resumes and question papers), used in a later step
app.upload-dir=uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB